name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler:
          - 4.14.x
          - 5.0.x
          - 5.1.x
          - 5.2.x
          - 5.3.x
          - 5.4.x
          - 5.5.x
        os: [ubuntu-latest]
        exclude:
          - ocaml-compiler: 5.0.x
        include:
          # OCaml 5.0.0 does not compile with the GCC of newer runner images.
          - ocaml-compiler: 5.0.x
            os: ubuntu-24.04

    runs-on: ${{matrix.os}}

    steps:
      - uses: actions/checkout@v4

      - name: Use OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{matrix.ocaml-compiler}}

      - run: opam install dune cppo

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune test
