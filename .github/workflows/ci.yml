name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler:
          - 4.14.x
          - 5.0.x
          - 5.1.x
          - 5.2.x
          - 5.3.x

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{matrix.ocaml-compiler}}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: opam install dune cppo

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- npm test
